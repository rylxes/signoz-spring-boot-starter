# Defaults for the e2e demo services; each scenario passes the rest on the command line.
spring.application.name=e2e-${e2e.name:x}
e2e.peer-url=http://localhost:1
spring.main.banner-mode=off
management.endpoints.web.exposure.include=health

# In-memory database for slow query detection.
spring.datasource.url=jdbc:h2:mem:e2e;DB_CLOSE_DELAY=-1
spring.datasource.username=sa

# Kafka: the interceptors exactly as the tracing guide shows. Inert unless e2e.kafka.enabled.
spring.kafka.bootstrap-servers=${e2e.kafka.bootstrap:localhost:1}
spring.kafka.producer.properties.interceptor.classes=io.signoz.springboot.messaging.TracingProducerInterceptor
spring.kafka.consumer.properties.interceptor.classes=io.signoz.springboot.messaging.TracingConsumerInterceptor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=${e2e.kafka.enabled:false}

# Spring Cloud AWS 3 (Boot 3 only; ignored on Boot 2). Inert unless e2e.sqs.enabled.
spring.cloud.aws.sqs.enabled=${e2e.sqs.enabled:false}
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=e2e
spring.cloud.aws.credentials.secret-key=e2e
spring.cloud.aws.sqs.endpoint=${e2e.sqs.endpoint:http://localhost:1}

# Keep third-party noise out of the captured output.
logging.level.org.apache.kafka=WARN
logging.level.io.awspring=WARN
logging.level.com.amazonaws=WARN
logging.level.org.elasticmq=WARN
